name: Tests
on:
  pull_request:
  push:
  repository_dispatch:
    types:
      - dispatched_test

env:
  ref: ${{ github.event.client_payload.ref || '' }}

permissions:
  contents: read

jobs:
    tox:
      runs-on: ubuntu-24.04
      strategy:
        matrix:
          python_version:
            - "3.8"
          tox_env:
            - style
            - docs
          include:
            - tox_env: py38
              python_version: "3.8"
              friendly_name: Python 3.8 - Tests
            - tox_env: py39
              python_version: "3.9"
              friendly_name: Python 3.9 - Tests
            - tox_env: py310
              python_version: "3.10"
              friendly_name: Python 3.10 - Tests
            - tox_env: py311
              python_version: "3.11"
              friendly_name: Python 3.11 - Tests
            - tox_env: style
              friendly_name: Style
            - tox_env: docs
              friendly_name: Docs
        fail-fast: false
      name: Tox - ${{ matrix.friendly_name }}
      steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ env.ref }}
            persist-credentials: false
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: ${{ matrix.python_version }}
        - name: Install tox
          run: |
            python -m pip install --upgrade pip
            pip install tox
        - name: Tox test
          env:
            TOXENV: ${{ matrix.tox_env }}
          run: tox

    tox-postgres:
      runs-on: ubuntu-24.04
      strategy:
        matrix:
          python_version:
            - "3.8"
            - "3.9"
            - "3.10"
            - "3.11"
        fail-fast: false
      name: Tox - Postgres
      services:
        postgresql:
          image: postgres:10@sha256:bbfa49841dd850850a663baf887a960aa778ad14faf4d206d9293b7f1876f143
          ports:
            - 5432:5432
          env:
            POSTGRES_DB: red_db
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
      steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ env.ref }}
            persist-credentials: false
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: ${{ matrix.python_version }}
        - name: Install tox
          run: |
            python -m pip install --upgrade pip
            pip install tox
        - name: Tox test
          env:
            TOXENV: postgres
            PGDATABASE: red_db
            PGUSER: postgres
            PGPASSWORD: postgres
            PGPORT: 5432
          run: tox
        - name: Verify no errors in PostgreSQL logs.
          env:
            POSTGRESQL_CONTAINER_ID: ${{ job.services.postgresql.id }}
          run: |
            logs="$(docker logs "$POSTGRESQL_CONTAINER_ID" 2>&1)"
            echo "---- PostgreSQL logs ----"
            echo "$logs"
            echo "---- PostgreSQL logs ----"
            error_count="$(echo "$logs" | { grep -c 'ERROR: ' || true; })"
            if [[ $error_count -gt 0 ]]; then
              exit 1
            fi
